apiVersion: v1
kind: Secret
metadata:
  annotations:
    checkov.io/skip1: "CKV_K8S_21=Install into a dedicated namespace with --namespace; honor the Helm release namespace."
  namespace: {{ .Release.Namespace }}
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HEADER: {{ .Values.securityHeader.name | default "X-Auth-Token" | b64enc }}
  VALUE: {{ required "Set securityHeader.value to a strong authentication token" .Values.securityHeader.value | b64enc }}
