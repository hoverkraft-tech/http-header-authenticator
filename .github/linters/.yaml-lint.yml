---
extends: default
rules:
  line-length:
    max: 160
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
# Helm templates are validated after rendering by the chart and security checks.
ignore: |
  **/helm/chart/templates/**
