---
# Prepare committed chart versions, validate the dispatched tag, then publish.
name: Release

on:
  # checkov:skip=CKV_GHA_7:Force overrides only the no-change plan, never validation or publication checks.
  workflow_dispatch:
    inputs:
      force:
        description: Release even without changes
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/prepare-chart-release.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      path: helm/chart
      update-app-version: true
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
    with:
      candidate-images: true

  promote:
    needs: validate
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ needs.validate.outputs.job-results }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    name: Mirror validated image to Docker Hub
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Copy the validated multi-platform manifest
        env:
          IMAGE: ${{ fromJSON(needs.promote.outputs.built-images).app.images[0] }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: docker buildx imagetools create --tag "docker.io/webofmars/http-header-authenticator:$RELEASE_TAG" "$IMAGE"

  release-chart:
    needs: [prepare, validate, mirror]
    # TODO: Replace this candidate pin with a released SHA after https://github.com/hoverkraft-tech/ci-github-container/pull/999
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-release.yml@d21c49f884d2ca8406bcab4bce9c44b29ce4a8ed # PR #999 (unreleased)
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      path: helm/chart
      config: ct.yaml
      helm-set: ${{ needs.validate.outputs.chart-helm-set }}
      runs-on: '["self-hosted"]'
      oci-registry: harbor.hoverkraft.cloud
      oci-repository: public/charts
    secrets:
      oci-registry-username: ${{ secrets.HARBOR_REGISTRY_USER }}
      oci-registry-password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

  release:
    needs: [prepare, release-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/create@bf24f894f60a3def62a8750f3964d05acb052c11 # 3.1.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          target-ref: ${{ github.sha }}
          changelog-summary: ${{ secrets.CHANGELOG_SUMMARY }}
