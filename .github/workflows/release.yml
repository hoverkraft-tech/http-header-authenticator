---
# Prepare committed chart versions, validate the dispatched tag, then publish.
name: Release

on:
  # checkov:skip=CKV_GHA_7:Force overrides only the no-change plan, never validation or publication checks.
  workflow_dispatch:
    inputs:
      force:
        description: Release even without changes
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/prepare-chart-release.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      path: helm/chart
      update-app-version: true
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      code-quality: write
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
    with:
      candidate-images: true

  promote:
    needs: [prepare, validate]
    # TODO: Replace this candidate pin with a released SHA after https://github.com/hoverkraft-tech/ci-github-container/pull/1001
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@c9feed706862fc88f0fd33d287e6d6c12e738f74 # PR #1001 (unreleased)
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ needs.validate.outputs.job-results }}
      additional-destinations: |
        {"app":["docker.io/webofmars/http-header-authenticator:${{ needs.prepare.outputs.tag }}"]}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
      destination-credentials: |
        {"docker.io":{
          "username":${{ toJSON(vars.DOCKERHUB_REGISTRY_USERNAME) }},
          "password":${{ toJSON(secrets.DOCKERHUB_REGISTRY_PASSWORD) }}
        }}

  release-chart:
    needs: [prepare, validate, promote]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-release.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      path: helm/chart
      config: ct.yaml
      helm-set: ${{ needs.validate.outputs.chart-helm-set }}
      runs-on: '["self-hosted"]'
      oci-registry: harbor.hoverkraft.cloud
      oci-repository: public/charts
    secrets:
      oci-registry-username: ${{ secrets.HARBOR_REGISTRY_USER }}
      oci-registry-password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

  release:
    needs: [prepare, release-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/create@bf24f894f60a3def62a8750f3964d05acb052c11 # 3.1.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          target-ref: ${{ github.sha }}
          changelog-summary: ${{ secrets.CHANGELOG_SUMMARY }}
