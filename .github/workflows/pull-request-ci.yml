---
name: Pull request - Continuous Integration

on:
  merge_group:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      code-quality: write
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
