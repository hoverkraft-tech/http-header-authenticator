---
name: Main - Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
