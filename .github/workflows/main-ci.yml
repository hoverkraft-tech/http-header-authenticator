name: Main - Continuous Integration

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
