---
name: Internal - Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      candidate-images:
        description: Build temporary candidate images for release validation
        type: boolean
        default: false
    outputs:
      job-results:
        description: Build and validation results for promotion
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

jobs:
  lint:
    name: Repository quality
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      # Keep the repository-managed CodeQL default setup for Go.
      codeql-languages: ""
      lint-all: true
      javascript-linter-toolchain: ""
      python-linter-toolchain: ""
      linter-env: |
        IGNORE_GITIGNORED_FILES=true
        LOG_LEVEL=INFO
        VALIDATE_BASH=true
        VALIDATE_BASH_EXEC=true
        VALIDATE_BIOME_FORMAT=true
        VALIDATE_BIOME_LINT=true
        VALIDATE_CHECKOV=true
        VALIDATE_DOCKERFILE_HADOLINT=true
        VALIDATE_GITHUB_ACTIONS=true
        VALIDATE_GITHUB_ACTIONS_ZIZMOR=true
        VALIDATE_GIT_COMMITLINT=${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        VALIDATE_MARKDOWN=true
        VALIDATE_MARKDOWN_PRETTIER=true
        VALIDATE_NATURAL_LANGUAGE=true
        VALIDATE_SHELL_SHFMT=true
        VALIDATE_TRIVY=true
        VALIDATE_YAML=true
        VALIDATE_YAML_PRETTIER=true

  test:
    name: Go checks and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Track main while validating the new shared Go actions in consumers.
      - name: Setup Go
        uses: hoverkraft-tech/ci-github-go/actions/setup-go@main # ratchet:exclude - track shared language CI during adoption

      - name: Lint
        uses: hoverkraft-tech/ci-github-go/actions/lint@main # ratchet:exclude - track shared language CI during adoption

      - name: Test with race detection and coverage
        id: tests
        uses: hoverkraft-tech/ci-github-go/actions/test@main # ratchet:exclude - track shared language CI during adoption

      - name: Coveralls
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.out
          format: golang

      - name: Audit dependencies
        uses: hoverkraft-tech/ci-github-go/actions/audit@main # ratchet:exclude - track shared language CI during adoption

  chart-testing:
    name: Test chart with the built image
    needs: docker-build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: prepare-chart
        uses: hoverkraft-tech/ci-github-container/actions/helm/prepare-chart@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
        with:
          path: helm/chart

      - uses: hoverkraft-tech/ci-github-container/actions/helm/lint-chart@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
        with:
          archive: ${{ steps.prepare-chart.outputs.archive }}
          checksum: ${{ steps.prepare-chart.outputs.checksum }}
          config: ct.yaml

      - id: image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILT_IMAGES: ${{ needs.docker-build-images.outputs.built-images }}
        with:
          script: |
            const { images, digest } = JSON.parse(process.env.BUILT_IMAGES).app;
            const reference = images[0].split('@')[0];
            const separator = reference.lastIndexOf(':');
            if (separator <= reference.lastIndexOf('/') || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
              throw new Error('Expected a tagged image with an immutable digest');
            }
            core.setOutput('repository', reference.slice(0, separator));
            core.setOutput('tag', `${reference.slice(separator + 1)}@${digest}`);

      - uses: hoverkraft-tech/ci-github-container/actions/helm/test-chart@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
        with:
          archive: ${{ steps.prepare-chart.outputs.archive }}
          checksum: ${{ steps.prepare-chart.outputs.checksum }}
          config: ct.yaml
          helm-set: |
            securityHeader.value=ci-test-value
            image.repository=${{ steps.image.outputs.repository }}
            image.tag=${{ steps.image.outputs.tag }}
            imagePullSecrets[0].name=regcred

      - name: Clean prepared chart archive
        if: always() && steps.prepare-chart.outputs.archive != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHART_ARCHIVE: ${{ steps.prepare-chart.outputs.archive }}
        with:
          script: await io.rmRF(process.env.CHART_ARCHIVE);

  docker-build-images:
    name: "Docker: Build Images"
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
    permissions:
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: ${{ inputs.candidate-images }}
      images: |
        [{
          "name": "app",
          "dockerfile": "./Dockerfile",
          "platforms": [
            "linux/amd64",
            "linux/arm64"
          ]
        }]
  test-image:
    name: Test container authentication
    needs: docker-build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      validated-images: ${{ needs.docker-build-images.outputs.built-images }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check allowed and rejected requests against the built digest
        env:
          IMAGE: ${{ fromJSON(needs.docker-build-images.outputs.built-images).app.images[0] }}
        run: |
          container=$(docker run -d --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 1s -p 127.0.0.1::8080 -e HEADER=X-Test-Token -e VALUE=ci-test-value "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8080/tcp | cut -d: -f2)
          url="http://127.0.0.1:$port"
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 "$url/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Test-Token: ci-test-value' "$url/check")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Test-Token: wrong-value' "$url/check")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/check")" = 403
          test "$(docker exec "$container" id -u)" = 10001
          for _ in {1..15}; do
            if test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

  reports:
    if: ${{ !cancelled() }}
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
