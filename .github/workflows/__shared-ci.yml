---
name: Internal - Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      candidate-images:
        description: Build temporary candidate images for release validation
        type: boolean
        default: false
    outputs:
      chart-helm-set:
        description: Installation overrides for the validated immutable image
        value: ${{ jobs.test-image.outputs.helm-set }}
      job-results:
        description: Build and validation results for promotion
        value: ${{ toJSON(jobs) }}

permissions: {}

jobs:
  lint:
    name: Repository quality
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      # Keep the repository-managed CodeQL default setup for Go.
      codeql-languages: ""
      lint-all: true
      # GO_MODULES runs the full linter recursively; standalone-file mode cannot span packages.
      linter-env: |
        VALIDATE_GO=false
        GOTOOLCHAIN=local
        IGNORE_GITIGNORED_FILES=true
        LOG_LEVEL=INFO

  test:
    name: Go checks and coverage
    # TODO: Replace this candidate pin with a released SHA after https://github.com/hoverkraft-tech/ci-github-go/pull/13
    uses: hoverkraft-tech/ci-github-go/.github/workflows/continuous-integration.yml@9968f40606caff42d54df871ffe01dec80409107 # PR #13 (unreleased)
    permissions:
      contents: read
      id-token: write
    with:
      test: '{"coverage":"coveralls"}'

  chart-testing:
    name: Test chart with the validated image
    needs: [docker-build-images, test-image]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      contents: read
      packages: read
    with:
      path: helm/chart
      config: ct.yaml
      images: ${{ needs.docker-build-images.outputs.built-images }}
      helm-set: ${{ needs.test-image.outputs.helm-set }}

  docker-build-images:
    name: "Docker: Build Images"
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: ${{ inputs.candidate-images }}
      images: |
        [{
          "name": "app",
          "dockerfile": "./Dockerfile",
          "platforms": [
            "linux/amd64",
            "linux/arm64"
          ]
        }]
  test-image:
    name: Test container authentication
    needs: docker-build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      validated-images: ${{ needs.docker-build-images.outputs.built-images }}
      helm-set: ${{ steps.image.outputs.helm-set }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check allowed and rejected requests against the built digest
        env:
          IMAGE: ${{ fromJSON(needs.docker-build-images.outputs.built-images).app.images[0] }}
        run: |
          container=$(docker run -d --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 1s -p 127.0.0.1::8080 -e HEADER=X-Test-Token -e VALUE=ci-test-value "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8080/tcp | cut -d: -f2)
          url="http://127.0.0.1:$port"
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 "$url/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Test-Token: ci-test-value' "$url/check")" = 200 # gitleaks:allow - test token
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Test-Token: wrong-value' "$url/check")" = 403 # gitleaks:allow - invalid test token
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/check")" = 403
          test "$(docker exec "$container" id -u)" = 10001
          for _ in {1..15}; do
            if test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

      - name: Map the validated digest into chart values
        id: image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILT_IMAGES: ${{ needs.docker-build-images.outputs.built-images }}
        with:
          script: |
            const { images, digest } = JSON.parse(process.env.BUILT_IMAGES).app;
            const reference = images[0].split('@')[0];
            const separator = reference.lastIndexOf(':');
            if (separator <= reference.lastIndexOf('/') || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
              throw new Error('Expected a tagged image with an immutable digest');
            }
            core.setOutput('helm-set', [
              'securityHeader.value=ci-test-value',
              `image.repository=${reference.slice(0, separator)}`,
              `image.tag=${reference.slice(separator + 1)}@${digest}`,
              'imagePullSecrets[0].name=regcred',
            ].join('\n'));

  reports:
    if: ${{ !cancelled() }}
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
